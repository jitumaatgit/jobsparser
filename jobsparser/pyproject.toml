[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "jobsparser"
version = "0.1.13"
description = "CLI tool to scrape Indeed for a personal job search"
authors = [
    {name = "jitumaatgit"}
]
readme = "../README.md"
requires-python = ">=3.10"
license = "MIT"
keywords = ["jobs", "scraping", "cli", "indeed"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Topic :: Internet :: WWW/HTTP :: Dynamic Content",
]
dependencies = [
    "click>=8.0.0",
    "pandas>=2.0.0",
    "python-jobspy @ git+https://github.com/speedyapply/JobSpy.git"
]

[project.urls]
Repository = "https://github.com/jitumaatgit/jobsparser"

[project.scripts]
jobsparser = "jobsparser.cli:main"

[tool.black]
line-length = 88

[tool.hatch.build.targets.wheel]
packages = ["src/jobsparser"]

[tool.hatch.metadata]
allow-direct-references = true
